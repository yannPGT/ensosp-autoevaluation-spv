name: Widget GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Le lockfile sera ajouté dès que le premier install local aura réussi.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ensosp/widget build
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/widget/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
